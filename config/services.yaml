# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    # Domain is excluded: pure business classes are never services (clean architecture)
    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Kernel.php'

    App\Presentation\Http\:
        resource: '../src/Presentation/Http/'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    # Composition root: bind Application ports to Infrastructure adapters here
    App\Application\Identity\Port\PrivyTokenVerifierInterface: '@App\Infrastructure\Privy\PrivyJwtVerifier'
    App\Application\Identity\Port\PrivyIdentityTokenVerifierInterface: '@App\Infrastructure\Privy\PrivyIdentityTokenVerifier'
    App\Application\Identity\Port\UserRepositoryInterface: '@App\Infrastructure\Persistence\DoctrineUserRepository'

    App\Infrastructure\Privy\PrivyJwtVerifier:
        arguments:
            $privyAppId: '%env(PRIVY_APP_ID)%'
            $verificationKey: '%env(PRIVY_VERIFICATION_KEY)%'

    App\Infrastructure\Privy\PrivyIdentityTokenVerifier:
        arguments:
            $privyAppId: '%env(PRIVY_APP_ID)%'
            $verificationKey: '%env(PRIVY_VERIFICATION_KEY)%'

    App\Application\Vault\Port\BlockchainReaderInterface: '@App\Infrastructure\Gateways\EthCallBlockchainReader'
    App\Application\Vault\Port\VaultAddressResolverInterface: '@App\Infrastructure\Gateways\CachedVaultAddressResolver'
    App\Application\Vault\Port\YieldSnapshotRepositoryInterface: '@App\Infrastructure\Persistence\DoctrineYieldSnapshotRepository'

    App\Infrastructure\Gateways\EthCallBlockchainReader:
        arguments:
            $baseRpcUrl: '%env(BASE_RPC_URL)%'

    App\Infrastructure\Gateways\CachedVaultAddressResolver:
        arguments:
            $vaultAddress: '%env(VAULT_ADDRESS)%'

    App\Application\Vault\UseCase\VaultPositionReader:
        arguments:
            $vaultAddress: '%env(VAULT_ADDRESS)%'
            $gdaForwarderAddress: '%env(GDA_FORWARDER_ADDRESS)%'

    App\Application\Deposit\Port\TransactionReceiptReaderInterface: '@App\Infrastructure\Gateways\EthReceiptReader'
    # DepositTransactionStatusPublisher decorates the Doctrine repository so every save()
    # also pushes a Turbo Stream update over Mercure (see config/packages/mercure.yaml).
    App\Application\Deposit\Port\DepositTransactionRepositoryInterface: '@App\Infrastructure\Mercure\DepositTransactionStatusPublisher'

    App\Infrastructure\Mercure\DepositTransactionStatusPublisher:
        arguments:
            $inner: '@App\Infrastructure\Persistence\DoctrineDepositTransactionRepository'

    App\Infrastructure\Gateways\EthReceiptReader:
        arguments:
            $baseRpcUrl: '%env(BASE_RPC_URL)%'
            $vaultAddress: '%env(VAULT_ADDRESS)%'

    App\Application\Tontine\Port\TontineGroupRepositoryInterface: '@App\Infrastructure\Persistence\DoctrineTontineGroupRepository'

    App\Application\Safe\Port\SafeTransactionRepositoryInterface: '@App\Infrastructure\Persistence\DoctrineSafeTransactionRepository'
    App\Application\Safe\Port\SafeReceiptReaderInterface: '@App\Infrastructure\Gateways\EthSafeReceiptReader'

    App\Infrastructure\Gateways\EthSafeReceiptReader:
        arguments:
            $baseRpcUrl: '%env(BASE_RPC_URL)%'
            $proxyFactoryAddress: '%env(SAFE_PROXY_FACTORY_ADDRESS)%'
