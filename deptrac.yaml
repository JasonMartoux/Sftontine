deptrac:
    paths:
        - ./src

    layers:
        -
            name: Domain
            collectors:
                -
                    type: directory
                    value: src/Domain/.*
        -
            name: Application
            collectors:
                -
                    type: directory
                    value: src/Application/.*
        -
            name: Infrastructure
            collectors:
                -
                    type: directory
                    value: src/Infrastructure/.*
        -
            name: Presentation
            collectors:
                -
                    type: directory
                    value: src/Presentation/.*
        # Vendor layers: make framework dependencies explicit so the inner
        # circles (Domain, Application) provably stay framework-free.
        -
            name: Money
            collectors:
                -
                    type: classNameRegex
                    value: /^Money\\/
        -
            name: BcMath
            collectors:
                -
                    type: classNameRegex
                    value: /^BcMath\\/
        -
            name: Psr
            collectors:
                -
                    type: classNameRegex
                    value: /^Psr\\/
        -
            name: Symfony
            collectors:
                -
                    type: classNameRegex
                    value: /^Symfony\\/
        -
            name: Doctrine
            collectors:
                -
                    type: bool
                    must:
                        -
                            type: classNameRegex
                            value: /^Doctrine\\/
                    must_not:
                        -
                            type: classNameRegex
                            value: /^Doctrine\\ORM\\Mapping\\/
        # Narrower than the Doctrine layer above: pure mapping metadata
        # (attributes), no behavioral coupling. Allowed in Domain so entities
        # can be mapped without a separate XML/persistence-model layer.
        -
            name: DoctrineMappingAttributes
            collectors:
                -
                    type: classNameRegex
                    value: /^Doctrine\\ORM\\Mapping\\/
        -
            name: VendorMisc
            collectors:
                -
                    type: classNameRegex
                    value: /^(Firebase|kornrunner|Twig|Monolog)\\/

    ruleset:
        # Dependency arrow always points inward
        Domain:
            - Money # pure value-object library, allowed in the domain
            - BcMath # native PHP extension class, raw on-chain uint256/int96 values
            - DoctrineMappingAttributes # metadata only, read via reflection, no runtime coupling
        Application:
            - Domain
            - Money
            - BcMath
            - Psr # PSR interfaces only (clock, logger), never implementations
        Infrastructure:
            - Application
            - Domain
            - Money
            - BcMath
            - Psr
            - Symfony
            - Doctrine
            - VendorMisc
        Presentation:
            - Application
            - Domain
            - Money
            - BcMath
            - Psr
            - Symfony
            - VendorMisc
