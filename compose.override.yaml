---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # var/ kept on the bind-mount (Linux dev env) so var/log, var/cache/dev and the
      # profiler storage are visible from the host for debugging (symfony-ai-mate MCP, local tools).
      # Uncomment on Mac/Windows for faster I/O:
      #- /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

  # Local fork of Base mainnet for the Deposit integration tests (JAS-19/M6). Not started by
  # `docker compose up` — opt in with `make anvil-up` (profile "integration"). Reused by M5/M6
  # for withdraw/E2E test infra.
  #
  # The default free public RPC occasionally rejects a storage/state lookup with a 403
  # "Archive requests require a personal token" error, which crashes Anvil outright — observed
  # while brute-forcing the USDC balance storage slot in DepositFlowTest. If `make anvil-up`
  # crashes, either retry (`docker compose --profile integration up -d anvil --force-recreate`,
  # usually transient) or set ANVIL_FORK_RPC_URL to an archive-capable provider (Alchemy,
  # Infura, QuickNode...) in `.env.local`.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles: ["integration"]
    entrypoint: ["anvil"]
    command:
      - "--host"
      - "0.0.0.0"
      - "--fork-url"
      - "${ANVIL_FORK_RPC_URL:-https://base-rpc.publicnode.com}"
    ports:
      - "8545"
